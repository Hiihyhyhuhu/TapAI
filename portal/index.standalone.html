<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAP AI — Merchant Partner Portal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310B981'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            panel: '#0B0D13',
            surface: '#11141D',
            elevated: '#171B26',
            highlight: '#1E2332',
            subtle: '#282F44',
            border: '#202637',
            'border-light': '#2D354D',
            brand: '#10B981',
            'brand-focus': '#059669',
            'brand-subtle': 'rgba(16, 185, 129, 0.08)',
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0B0D13;
      color: #F1F5F9;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    /* Fix triệt để lỗi phông chữ tiếng Việt cho văn bản hợp đồng */
    .contract-document, .contract-document * {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif !important;
      letter-spacing: normal !important;
      word-spacing: normal !important;
    }

    /* Precision hairline borders */
    .border-hairline { border: 1px solid #1E2436; }
    .border-hairline-b { border-bottom: 1px solid #1E2436; }
    .border-hairline-t { border-top: 1px solid #1E2436; }
    .border-hairline-r { border-right: 1px solid #1E2436; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #262D42; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #37415E; }

    /* Focus ring for accessibility */
    *:focus-visible {
      outline: 2px solid #10B981;
      outline-offset: 1px;
    }

    /* Skeleton loader */
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    .skeleton {
      background: #171B26;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: 6px;
    }

    /* Buttons */
    .btn-solid-primary {
      background: #10B981;
      color: #061A13;
      font-weight: 600;
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-solid-primary:hover { background: #34D399; }
    .btn-solid-primary:active { background: #059669; }

    .btn-subtle {
      background: #171B26;
      border: 1px solid #282F44;
      color: #E2E8F0;
      font-weight: 500;
      border-radius: 7px;
      padding: 7px 13px;
      font-size: 13px;
      cursor: pointer;
      transition: all 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-subtle:hover { background: #1E2332; border-color: #37415E; color: #FFFFFF; }

    .btn-ghost {
      background: transparent;
      color: #94A3B8;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: color 120ms ease, background 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-ghost:hover { color: #FFFFFF; background: #171B26; }

    .btn-danger-ghost {
      background: transparent;
      color: #F87171;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background 120ms ease;
    }
    .btn-danger-ghost:hover { background: rgba(239, 68, 68, 0.12); }

    /* Inputs */
    .input-field {
      background: #0D1018;
      border: 1px solid #242B3D;
      border-radius: 7px;
      color: #F1F5F9;
      font-size: 13px;
      padding: 8px 12px;
      transition: border-color 120ms ease;
      width: 100%;
    }
    .input-field:focus {
      outline: none;
      border-color: #10B981;
      box-shadow: 0 0 0 1px #10B981;
    }
    .input-field::placeholder { color: #475569; }

    /* Custom Toast */
    @keyframes toastSlide {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-anim { animation: toastSlide 150ms ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-brand selection:text-panel">

  <!-- Toast Container (Top-most Layer above all modals) -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none" role="status" aria-live="polite"></div>

  <!-- Primary Header Bar -->
  <header class="bg-surface border-hairline-b sticky top-0 z-30">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      
      <!-- Left: Logo & Workspace Context -->
      <div class="flex items-center gap-4">
        <a href="javascript:void(0)" onclick="switchTab('dashboard')" class="flex items-center gap-2.5" aria-label="Trang chủ TAP AI">
          <div class="w-7 h-7 rounded bg-brand flex items-center justify-center font-bold text-panel text-xs">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <span class="font-bold text-[14px] text-white tracking-tight">TAP AI</span>
          <span class="text-[11px] font-mono font-medium px-1.5 py-0.5 rounded bg-subtle text-slate-300">MERCHANT</span>
        </a>

        <!-- Breadcrumb / Active Context -->
        <div id="header-context" class="hidden md:flex items-center gap-2 text-xs border-l border-border pl-4 text-slate-400">
          <!-- Injected via JS -->
        </div>
      </div>

      <!-- Center: Navigation Tabs (Desktop, visible when logged in) -->
      <nav id="nav-tabs" class="hidden md:flex items-center gap-1 bg-panel p-1 rounded-lg border border-border" aria-label="Desktop Navigation">
        <button onclick="switchTab('dashboard')" id="tab-btn-dashboard" class="px-3.5 py-1.5 rounded-md text-xs font-semibold text-brand bg-elevated border border-border transition min-h-[36px]">
          Tổng quan
        </button>
        <button onclick="switchTab('products')" id="tab-btn-products" class="px-3.5 py-1.5 rounded-md text-xs font-medium text-slate-400 hover:text-white transition min-h-[36px]">
          Sản phẩm &amp; Đấu thầu CPC
        </button>
        <button onclick="switchTab('reconciliation')" id="tab-btn-reconciliation" class="px-3.5 py-1.5 rounded-md text-xs font-medium text-slate-400 hover:text-white transition min-h-[36px]">
          Ví ký quỹ &amp; Click Ledger
        </button>
        <button onclick="switchTab('verification')" id="tab-btn-verification" class="px-3.5 py-1.5 rounded-md text-xs font-medium text-slate-400 hover:text-white transition min-h-[36px]">
          Hợp đồng số &amp; Xác thực
        </button>
      </nav>

      <!-- Right: Actions & User Info -->
      <div id="auth-actions" class="flex items-center gap-2.5 text-xs">
        <!-- Injected via JS -->
      </div>
    </div>
  </header>

  <!-- Mobile Bottom Navigation Bar (Visible on mobile when logged in) -->
  <nav id="mobile-nav-bar" class="hidden md:hidden fixed bottom-0 left-0 right-0 z-40 bg-surface/95 backdrop-blur border-hairline-t py-1 px-2 flex items-center justify-around shadow-2xl" aria-label="Mobile Navigation">
    <button onclick="switchTab('dashboard')" id="mobile-tab-btn-dashboard" class="flex flex-col items-center gap-0.5 text-[10px] font-semibold text-brand transition min-h-[44px] justify-center px-2" aria-label="Chuyển đến Tổng quan">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span>Tổng quan</span>
    </button>
    <button onclick="switchTab('products')" id="mobile-tab-btn-products" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-slate-400 hover:text-white transition min-h-[44px] justify-center px-2" aria-label="Chuyển đến Sản phẩm">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Sản phẩm CPC</span>
    </button>
    <button onclick="switchTab('reconciliation')" id="mobile-tab-btn-reconciliation" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-slate-400 hover:text-white transition min-h-[44px] justify-center px-2" aria-label="Chuyển đến Ví và Click Ledger">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Ví &amp; Clicks</span>
    </button>
    <button onclick="switchTab('verification')" id="mobile-tab-btn-verification" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-slate-400 hover:text-white transition min-h-[44px] justify-center px-2" aria-label="Chuyển đến Hợp đồng và Xác minh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Hợp đồng số</span>
    </button>
  </nav>

  <!-- Main View Workspace -->
  <main class="flex-1 max-w-[1400px] w-full mx-auto px-4 sm:px-6 py-6 pb-20 md:pb-8" id="main-content">
    <!-- Injected dynamically based on state -->
  </main>

  <!-- Minimal System Footer -->
  <footer class="border-hairline-t bg-surface/50 py-4 mt-auto">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400 font-mono">
      <div class="flex items-center gap-3">
        <span class="inline-block w-2 h-2 rounded-full bg-brand"></span>
        <span>TAP AI Video Ingestion Engine: Online</span>
      </div>
      <div class="flex items-center gap-5">
        <a href="http://localhost:8000/docs" target="_blank" rel="noopener" class="hover:text-slate-300 transition py-2 px-1 inline-flex items-center min-h-[36px]">Swagger API ↗</a>
        <span>Endpoint: localhost:8000</span>
      </div>
    </div>
  </footer>

  <!-- Auth Modal (Clean Enterprise Dialog) -->
  <div id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="modal-tab-login" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/70 backdrop-blur-[2px]">
    <div class="bg-surface border-hairline rounded-xl max-w-[420px] w-full p-6 shadow-2xl relative">
      <button onclick="closeAuthModal()" aria-label="Đóng cửa sổ đăng nhập" class="absolute top-4 right-4 text-slate-400 hover:text-white w-7 h-7 flex items-center justify-center rounded-md hover:bg-elevated transition">
        ✕
      </button>

      <div class="flex gap-2 p-1 bg-panel rounded-lg mb-4 border border-border">
        <button id="modal-tab-login" onclick="setAuthMode('login')" class="flex-1 py-1.5 rounded text-xs font-semibold bg-elevated text-white border border-border transition">
          Đăng nhập
        </button>
        <button id="modal-tab-register" onclick="setAuthMode('register')" class="flex-1 py-1.5 rounded text-xs font-medium text-slate-400 hover:text-white transition">
          Tạo tài khoản gian hàng
        </button>
      </div>

      <!-- Modal Inline Alert (Immediately visible inside dialog) -->
      <div id="modal-alert" class="hidden mb-4 p-3 rounded-lg text-xs flex items-center gap-2 border"></div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
        <div>
          <label for="login-email" class="block font-medium text-slate-300 mb-1.5">Email hoặc Số điện thoại</label>
          <input type="text" id="login-email" name="login_email" required placeholder="contact@brand.vn hoặc 0988..." class="input-field" autocomplete="username">
        </div>
        <div>
          <label for="login-pwd" class="block font-medium text-slate-300 mb-1.5">Mật khẩu</label>
          <input type="password" id="login-pwd" name="login_pwd" required placeholder="••••••••" class="input-field" autocomplete="current-password">
        </div>
        <button type="submit" id="btn-submit-login" class="btn-solid-primary w-full justify-center py-2.5 mt-2 min-h-[40px]">
          Đăng nhập vào Portal
        </button>
      </form>

      <!-- Register Form -->
      <form id="form-register" onsubmit="handleRegisterSubmit(event)" class="space-y-3 text-xs hidden">
        <div>
          <label for="reg-shop-name" class="block font-medium text-slate-300 mb-1">Tên thương hiệu / Gian hàng (*)</label>
          <input type="text" id="reg-shop-name" name="shop_name" required placeholder="VD: Ananas Vietnam" class="input-field" autocomplete="organization">
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label for="reg-platform" class="block font-medium text-slate-300 mb-1">Nền tảng TMĐT</label>
            <select id="reg-platform" name="platform" class="input-field">
              <option value="shopee">Shopee</option>
              <option value="tiktok_shop">TikTok Shop</option>
              <option value="lazada">Lazada</option>
              <option value="tiki">Tiki</option>
            </select>
          </div>
          <div>
            <label for="reg-phone" class="block font-medium text-slate-300 mb-1">Số điện thoại</label>
            <input type="tel" id="reg-phone" name="phone" required placeholder="0988112233" class="input-field" autocomplete="tel">
          </div>
        </div>
        <div>
          <label for="reg-email" class="block font-medium text-slate-300 mb-1">Email doanh nghiệp</label>
          <input type="email" id="reg-email" name="email" required placeholder="contact@brand.vn" class="input-field" autocomplete="email">
        </div>
        <div>
          <label for="reg-shop-url" class="block font-medium text-slate-300 mb-1">Link gian hàng</label>
          <input type="url" id="reg-shop-url" name="shop_url" required placeholder="https://shopee.vn/ananas.vn" class="input-field" autocomplete="url">
        </div>
        <div>
          <label for="reg-pwd" class="block font-medium text-slate-300 mb-1">Mật khẩu (≥ 6 ký tự)</label>
          <input type="password" id="reg-pwd" name="reg_password" required placeholder="••••••••" class="input-field" autocomplete="new-password">
        </div>
        <button type="submit" id="btn-submit-reg" class="btn-solid-primary w-full justify-center py-2.5 mt-2 min-h-[40px]">
          Gửi mã OTP xác thực
        </button>
      </form>

      <!-- OTP Form -->
      <form id="form-otp" onsubmit="handleOtpSubmit(event)" class="space-y-4 text-xs hidden">
        <label for="otp-input" class="block text-slate-300 text-center font-medium">Nhập mã OTP 6 chữ số vừa gửi đến email:</label>
        <input type="text" id="otp-input" name="otp_code" maxlength="6" placeholder="000000" required aria-label="Mã OTP 6 chữ số" autocomplete="one-time-code" class="input-field text-center font-mono text-xl tracking-[0.5em] font-bold py-2.5">
        <button type="submit" class="btn-solid-primary w-full justify-center py-2.5 min-h-[40px]">
          Xác thực & Vào Bảng điều khiển
        </button>
      </form>
    </div>
  </div>

  <!-- CORE LOGIC JAVASCRIPT -->
  <script>
    const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:8000';
    let currentShop = null;
    let currentTab = 'dashboard';
    let dailyChartInstance = null;
    let pendingOtpEmail = '';

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
    });

    // Toast notification
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const border = type === 'success' ? 'border-emerald-600 bg-surface text-slate-100' :
                     type === 'error' ? 'border-rose-600 bg-surface text-slate-100' :
                     'border-border-light bg-surface text-slate-100';
      const indicator = type === 'success' ? '<span class="w-2 h-2 rounded-full bg-emerald-500"></span>' :
                        type === 'error' ? '<span class="w-2 h-2 rounded-full bg-rose-500"></span>' :
                        '<span class="w-2 h-2 rounded-full bg-blue-500"></span>';
      toast.className = `pointer-events-auto border px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center gap-2.5 toast-anim ${border}`;
      toast.innerHTML = `${indicator}<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 200ms ease';
        setTimeout(() => toast.remove(), 200);
      }, 3500);
    }

    // API Wrapper
    async function apiRequest(endpoint, options = {}) {
      const token = localStorage.getItem('tapai_token');
      const headers = { ...(options.headers || {}) };
      if (!(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
      }
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }
      try {
        const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          let errMsg = `Lỗi HTTP ${res.status}`;
          if (typeof errData.detail === 'string') {
            errMsg = errData.detail;
          } else if (Array.isArray(errData.detail)) {
            errMsg = errData.detail.map(d => `${d.loc ? d.loc.slice(-1)[0] : 'Trường'}: ${d.msg.replace('Value error, ', '')}`).join(' | ');
          }
          throw new Error(errMsg);
        }
        return await res.json();
      } catch (err) {
        if (err.name === 'TypeError' && (err.message.includes('fetch') || err.message.includes('Failed'))) {
          throw new Error('Không thể kết nối đến máy chủ backend (http://localhost:8000). Vui lòng chạy lệnh: python run_portal.py');
        }
        throw err;
      }
    }

    // Check login state
    async function checkAuth() {
      const token = localStorage.getItem('tapai_token');
      if (!token) {
        currentShop = null;
        renderHeader();
        renderMain();
        return;
      }
      try {
        currentShop = await apiRequest('/api/v1/auth/me');
        renderHeader();
        renderMain();
      } catch (e) {
        localStorage.removeItem('tapai_token');
        currentShop = null;
        renderHeader();
        renderMain();
      }
    }

    // Render Navigation & Context
    function renderHeader() {
      const navTabs = document.getElementById('nav-tabs');
      const authActions = document.getElementById('auth-actions');
      const headerContext = document.getElementById('header-context');
      const mobileNavBar = document.getElementById('mobile-nav-bar');

      if (currentShop) {
        navTabs.classList.remove('hidden');
        navTabs.classList.add('md:flex');
        headerContext.classList.remove('hidden');
        if (mobileNavBar) mobileNavBar.classList.remove('hidden');
        
        const isContractActive = currentShop.contract_status === 'ACTIVE';
        const formatVND = (v) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(v);

        headerContext.innerHTML = `
          <span class="font-semibold text-white">${currentShop.shop_name}</span>
          <span>·</span>
          <span class="uppercase font-mono text-[11px]">${currentShop.platform}</span>
          <span>·</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold ${isContractActive ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
            HỢP ĐỒNG: ${currentShop.contract_status || 'PENDING'}
          </span>
        `;

        authActions.innerHTML = `
          <div class="hidden sm:flex items-center gap-1.5 bg-panel px-2.5 py-1 rounded-md border border-border font-mono text-xs text-slate-300">
            <span class="text-slate-400 text-[11px]">Ví ký quỹ:</span>
            <span class="text-emerald-400 font-bold tabular">${formatVND(currentShop.wallet_balance !== undefined ? currentShop.wallet_balance : 1000000)}</span>
            <button onclick="switchTab('reconciliation')" class="ml-1 text-[11px] text-teal-400 hover:text-teal-300 underline font-sans font-semibold">
              + Nạp
            </button>
          </div>
          <div class="hidden lg:block text-right font-mono text-[11px] text-slate-400 mr-1">
            ${currentShop.email}
          </div>
          <button onclick="handleLogout()" class="btn-subtle min-h-[36px]" aria-label="Đăng xuất khỏi tài khoản">
            Đăng xuất
          </button>
        `;
      } else {
        navTabs.classList.add('hidden');
        navTabs.classList.remove('md:flex');
        headerContext.classList.add('hidden');
        if (mobileNavBar) mobileNavBar.classList.add('hidden');
        authActions.innerHTML = `
          <button onclick="openAuthModal('login')" class="btn-ghost min-h-[36px]">
            Đăng nhập
          </button>
          <button onclick="openAuthModal('register')" class="btn-solid-primary min-h-[36px]">
            Đăng ký Gian hàng
          </button>
        `;
      }
    }

    // Switch Tab

    async function downloadMerchantFeedJson() {
      try {
        const token = localStorage.getItem('tapai_token');
        const res = await fetch('/api/v1/affiliate/products/feed/merchant-products?download=true', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        if (!res.ok) throw new Error('Không thể tải file JSON feed');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'merchant_products_feed.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Đã tải thành công file merchant_products_feed.json', 'success');
      } catch (err) {
        showToast(err.message || 'Lỗi tải feed JSON', 'error');
      }
    }

    async function dispatchMerchantFeed() {
      try {
        const res = await apiRequest('/api/v1/affiliate/products/feed/dispatch', { method: 'POST' });
        showToast(res.message || 'Đã dispatch feed thành công sang Core Ranking Backend', 'success');
      } catch (err) {
        showToast(err.message || 'Lỗi dispatch feed', 'error');
      }

    async function promptEditBidding(productId, curBid, curBudget) {
      const newBidStr = prompt("Nhập Giá thầu CPC cam kết mới (VNĐ/click):", curBid || 2000);
      if (newBidStr === null) return;
      const newBid = parseFloat(newBidStr);
      if (isNaN(newBid) || newBid < 500) {
        showToast("Giá thầu tối thiểu 500 VNĐ", "error");
        return;
      }

      const newBudgetStr = prompt("Nhập Ngân sách ngày tối đa (VNĐ):", curBudget || 100000);
      if (newBudgetStr === null) return;
      const newBudget = parseFloat(newBudgetStr);
      if (isNaN(newBudget) || newBudget < 10000) {
        showToast("Ngân sách ngày tối thiểu 10.000 VNĐ", "error");
        return;
      }

      try {
        await apiRequest(`/api/v1/affiliate/products/${productId}/bidding`, {
          method: 'PATCH',
          body: JSON.stringify({ cpc_bid: newBid, daily_budget: newBudget })
        });
        showToast("Đã cập nhật giá thầu CPC và ngân sách ngày thành công!", "success");
        renderProductsView();
      } catch (err) {
        showToast(err.message || "Lỗi cập nhật giá thầu", "error");
      }
    }

    function testProductGatewayLink(productId) {
      const link = `${window.location.origin}/r/${productId}?ext_uid=guest_${Date.now().toString().slice(-4)}`;
      navigator.clipboard.writeText(link).then(() => {
        showToast(`Đã sao chép link Gateway: ${link}`, 'success');
      }).catch(() => {
        prompt("Đường link Redirect Gateway:", link);
      });
    }

    function triggerDownloadJson(data, filename) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadProductJsonStandalone(p) {
      const formatVND = (v) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(v);
      const comm = p.commission || (p.commissions && p.commissions.length > 0 ? p.commissions[0] : null);
      const platRate = comm ? Number(comm.platform_rate || 0) : 0;
      const extraRate = comm ? Number(comm.extra_rate || 0) : 0;
      const totalRate = comm ? Number(comm.total_rate || (platRate + extraRate)) : (platRate + extraRate);
      const commType = comm ? (comm.commission_type || 'percentage') : 'percentage';
      const extraFixed = comm ? Number(comm.extra_fixed_amount || 0) : 0;

      const priceVal = Number(p.price || 0);
      const estCommission = commType === 'fixed_amount' && extraFixed > 0
        ? extraFixed
        : Math.round(priceVal * (totalRate / 100));

      let images = [];
      if (Array.isArray(p.image_urls)) {
        images = p.image_urls;
      } else if (typeof p.image_urls === 'string') {
        try { images = JSON.parse(p.image_urls); } catch(e) { images = [p.image_urls]; }
      }

      const exportData = {
        order_item_name: p.name,
        product_name: p.name,
        category: p.category,
        platform: p.platform,
        product_id: p.id,
        shop_id: p.shop_id,
        shop_name: p.shop_name || (currentShop ? currentShop.shop_name : ''),
        pricing: {
          price: priceVal,
          currency: p.currency || 'VND',
          price_formatted: formatVND(priceVal)
        },
        commission_rate: {
          commission_type: commType,
          total_rate_percent: totalRate,
          platform_rate_percent: platRate,
          extra_rate_percent: extraRate,
          extra_fixed_amount: extraFixed,
          estimated_commission_per_order: estCommission,
          estimated_commission_formatted: formatVND(estCommission)
        },
        product_url: p.product_url,
        thumbnail_url: p.thumbnail_url || (images.length > 0 ? images[0] : ''),
        image_urls: images,
        description: p.description || '',
        status: p.status,
        registered_at: p.created_at || new Date().toISOString(),
        export_metadata: {
          exported_at: new Date().toISOString(),
          generator: 'TAP AI Partner Engine',
          schema_version: '1.0.0',
          export_filename: `product_${p.id}.json`
        }
      };

      triggerDownloadJson(exportData, `product_${p.id}.json`);
    }

        const res = await fetch(`/api/v1/affiliate/products/${id}/export-json?download=true`, {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        if (!res.ok) throw new Error('Không thể tải file JSON');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `product_${id}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Đã tải xuống file JSON sản phẩm', 'success');
      } catch (err) {
        showToast(err.message || 'Lỗi tải JSON', 'error');
      }
    }

    async function downloadAllProductsJsonStandalone() {
      try {
        const token = localStorage.getItem('tapai_token');
        const res = await fetch('/api/v1/affiliate/products/export/all-json?download=true', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `all_products_${currentShop ? currentShop.id.slice(0, 8) : 'export'}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Đã tải xuống toàn bộ sản phẩm dạng JSON', 'success');
      } catch (err) {
        showToast(err.message || 'Lỗi xuất toàn bộ JSON', 'error');

    async function handleImportProductUrl(e) {
      e.preventDefault();
      const inputEl = document.getElementById('import-prod-url');
      const submitBtn = document.getElementById('btn-import-submit');
      const url = inputEl.value.trim();
      if (!url) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>⏳ Đang quét sàn...</span>`;

      try {
        const res = await apiRequest('/api/v1/affiliate/products/import-url', {
          method: 'POST',
          body: JSON.stringify({ product_url: url })
        });

        // Tự động tải xuống file JSON sản phẩm
        downloadProductJsonStandalone({
          id: res.id,
          name: res.title,
          category: 'Thời trang',
          product_url: res.original_url,
          platform: res.platform,
          price: res.current_price,
          commission: {
            platform_rate: res.platform_base_rate,
            extra_rate: res.seller_extra_rate,
            total_rate: res.total_commission_rate
          }
        });

        showToast(`Đã đồng bộ sản phẩm thành công! Hoa hồng sàn: ${res.total_commission_rate}%`, 'success');
        toggleAddProductForm();
        renderProductsView();
      } catch (err) {
        showToast(err.message || 'Lỗi quét sản phẩm từ sàn', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>⚡ Quét & Đăng ký ngay</span>`;
      }
    }

    async function runClickSimulation(testType) {
      const prodSelect = document.getElementById('sim-product-id');

      if (!prodSelect) return;

      const prodId = prodSelect.value;
      const uid = (uidInput ? uidInput.value.trim() : '') || 'tester_guest';

      let testParam = '';
      if (testType === 'duplicate') testParam = '&test_fraud=duplicate';
      if (testType === 'bot') testParam = '&test_fraud=bot';

      try {
        await fetch(`/r/${prodId}?ext_uid=${encodeURIComponent(uid)}${testParam}`, {
          redirect: 'manual'
        });

        showToast(`Đã gửi lượt click thử nghiệm [${testType.toUpperCase()}]!`, 'success');

        renderReconciliationView();
      }
    }

                <div class="text-[11px] text-slate-400 space-y-1 border-t border-border/60 pt-2.5">
                  <p><strong>Hướng dẫn thực hiện:</strong></p>
                  <p>1. Mở trang Kênh Người Bán Shopee hoặc TikTok Shop Seller Center của shop bạn: <code>${currentShop.shop_url}</code></p>
                  <p>2. Dán chuỗi <code>${contractData.ownership_token}</code> vào phần <strong>Giới thiệu gian hàng (Shop Bio)</strong> rồi bấm Lưu.</p>
                  <p>3. Bấm nút <strong>"Kiểm tra xác thực ngay"</strong> bên dưới để hoàn tất.</p>
                </div>
              </div>

              ${!isVerified ? `
                <button onclick="handleVerifyBio()" class="btn-solid-primary w-full justify-center py-2.5 text-xs min-h-[40px]">
                  🔍 Kiểm tra xác thực ngay
                </button>
              ` : `
                <div class="p-3 bg-emerald-950/20 border border-emerald-800/40 rounded-lg text-xs text-emerald-400 flex items-center gap-2">
                  <span>✓</span>
                  <span>Gian hàng đã được chứng thực chính chủ thành công thông qua mã Token trong Shop Bio.</span>
                </div>
              `}
            </div>

            <!-- Part 2: Digital CPC Agreement & E-Signature -->
            <div class="bg-surface border-hairline rounded-xl p-6 space-y-4">
              <div class="flex items-center justify-between border-hairline-b pb-3">
                <div>
                  <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <span>2. Hợp đồng Hợp tác Điện tử CPC (Digital CPC Agreement)</span>
                    <span class="text-[11px] font-mono px-2 py-0.5 rounded font-bold ${isContractActive ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                      ${isContractActive ? '✓ ACTIVE' : '○ PENDING'}
                    </span>
                  </h3>
                  <p class="text-xs text-slate-400 mt-1">Văn bản thỏa thuận khung về đơn giá CPC, chính sách ký quỹ Escrow và quy chế chống gian lận Click Fraud.</p>
                </div>
              </div>

              <!-- Contract Terms Scrollbox -->
              <div class="p-4 bg-panel border border-border rounded-lg max-h-72 overflow-y-auto space-y-3 font-sans" style="font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important; letter-spacing: normal !important;">
                ${contractData.terms_html || ''}
              </div>

              <!-- E-Signature Action Box -->
              <div class="p-4 bg-panel border border-border rounded-lg space-y-3">
                ${isContractActive ? `
                  <div class="space-y-2">
                    <div class="flex items-center gap-2 text-emerald-400 font-semibold text-xs">
                      <span>✓</span>
                      <span>HỢP ĐỒNG ĐÃ ĐƯỢC KÝ SỐ VÀ CÓ HIỆU LỰC (ACTIVE)</span>
                    </div>
                    <div class="text-[11px] text-slate-400 space-y-1 font-mono">
                      <div>Thời gian ký: <span class="text-white">${contractData.contract_signed_at || 'Đã ký'}</span></div>
                      <div>Bảo chứng toàn vẹn (SHA-256 Hash):</div>
                      <div class="p-2 bg-black/50 border border-border rounded text-emerald-400 break-all select-all text-[11px]">
                        ${contractData.contract_hash || 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'}
                      </div>
                    </div>
                    <div class="text-[11px] text-slate-400 pt-1">
                      Toàn bộ tính năng Đăng ký sản phẩm, Thiết lập Bidding và Xuất JSON Feed đã được mở khóa!
                    </div>
                  </div>
                ` : `
                  <div class="space-y-3">
                    <div class="text-xs font-semibold text-white">
                      Ký số Hợp đồng bằng mã OTP (E-Signature)
                    </div>
                    <p class="text-[11px] text-slate-400">
                      Nhập mã OTP đã được gửi đến email hoặc số điện thoại của bạn để ký số xác lập hợp đồng (Chữ ký điện tử có giá trị pháp lý theo Luật Giao dịch Điện tử).
                    </p>
                    <div class="flex flex-col sm:flex-row gap-2">
                      <input 
                        type="text" 
                        id="contract-otp-input" 
                        placeholder="Nhập mã OTP (VD: 123456)" 
                        maxlength="6" 
                        class="input-field flex-1 text-xs font-mono tracking-widest text-center sm:text-left"
                      >
                      <button onclick="handleSignContractOtp()" class="btn-solid-primary text-xs whitespace-nowrap min-h-[36px]">
                        <span>✍️ Ký số Hợp đồng (E-Signature)</span>
                      </button>
                    </div>
                    <div class="text-[10px] text-slate-400 italic">
                      Gợi ý: Bạn có thể nhập mã OTP demo <code>123456</code> để hoàn tất ký số tức thì trong môi trường kiểm thử.
                    </div>
                  </div>
                `}
              </div>

            </div>

          </div>
        `;
      } catch (err) {
        main.innerHTML = `<div class="p-6 bg-surface border-hairline rounded-xl text-xs text-rose-400">${err.message}</div>`;
      }
    }

    function copyOwnershipToken(token) {
      navigator.clipboard.writeText(token || 'VERIFY-XXXX').then(() => {
        showToast('Đã sao chép mã Token: ' + token, 'success');
      });
    }

    async function handleVerifyBio() {
      try {
        const res = await apiRequest('/api/v1/shops/ownership/verify', { method: 'POST' });
        showToast(res.message || 'Xác thực gian hàng thành công!', 'success');
        renderVerificationView();
      } catch (err) {
        showToast(err.message || 'Lỗi xác thực', 'error');
      }
    }

    async function handleSignContractOtp() {
      const input = document.getElementById('contract-otp-input');
      const otp = input ? input.value.trim() : '';
      if (!otp) {
        showToast('Vui lòng nhập mã OTP', 'error');
        return;
      }

      try {
        const res = await apiRequest('/api/v1/shops/contract/sign', {
          method: 'POST',
          body: JSON.stringify({ otp_code: otp })
        });
        showToast(res.message || 'Ký số hợp đồng thành công! Hợp đồng đã ACTIVE.', 'success');
        if (currentShop) {
          currentShop.contract_status = 'ACTIVE';
          renderHeader();
        }
        renderVerificationView();
      } catch (err) {
        showToast(err.message || 'Mã OTP không đúng', 'error');
      }
    }


    // ==========================================
    // 4. AUTH MODAL HELPERS
    // ==========================================
    function openAuthModal(mode = 'login') {
      document.getElementById('auth-modal').classList.remove('hidden');
      setAuthMode(mode);
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function showModalAlert(msg, type = 'error') {
      const el = document.getElementById('modal-alert');
      if (!el) return;
      if (!msg) {
        el.classList.add('hidden');
        el.innerHTML = '';
        return;
      }
      el.classList.remove('hidden');
      if (type === 'error') {
        el.className = "mb-4 p-3 rounded-lg text-xs flex items-center gap-2 border border-rose-800 bg-rose-950/80 text-rose-200 animate-fadeIn";
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500 flex-shrink-0"></span><span>${msg}</span>`;
      } else if (type === 'success') {
        el.className = "mb-4 p-3 rounded-lg text-xs flex items-center gap-2 border border-emerald-800 bg-emerald-950/80 text-emerald-200 animate-fadeIn";
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0"></span><span>${msg}</span>`;
      } else {
        el.className = "mb-4 p-3 rounded-lg text-xs flex items-center gap-2 border border-blue-800 bg-blue-950/80 text-blue-200 animate-fadeIn";
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500 flex-shrink-0"></span><span>${msg}</span>`;
      }
    }

    function setAuthMode(mode) {
      showModalAlert(null);
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const otpForm = document.getElementById('form-otp');
      const tabLogin = document.getElementById('modal-tab-login');
      const tabReg = document.getElementById('modal-tab-register');

      loginForm.classList.add('hidden');
      regForm.classList.add('hidden');
      otpForm.classList.add('hidden');

      if (mode === 'login') {
        loginForm.classList.remove('hidden');
        tabLogin.className = "flex-1 py-1.5 rounded text-xs font-semibold bg-elevated text-white border border-border transition";
        tabReg.className = "flex-1 py-1.5 rounded text-xs font-medium text-slate-400 hover:text-white transition";
      } else if (mode === 'register') {
        regForm.classList.remove('hidden');
        tabReg.className = "flex-1 py-1.5 rounded text-xs font-semibold bg-elevated text-white border border-border transition";
        tabLogin.className = "flex-1 py-1.5 rounded text-xs font-medium text-slate-400 hover:text-white transition";
      } else if (mode === 'otp') {
        otpForm.classList.remove('hidden');
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      showModalAlert(null);
      const email = document.getElementById('login-email').value;
      const pwd = document.getElementById('login-pwd').value;
      try {
        const res = await apiRequest('/api/v1/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email_or_phone: email, password: pwd })
        });
        localStorage.setItem('tapai_token', res.access_token);
        closeAuthModal();
        showToast('Đăng nhập thành công', 'success');
        await checkAuth();
      } catch (err) {
        showModalAlert(err.message || 'Sai thông tin đăng nhập', 'error');
        showToast(err.message || 'Sai thông tin đăng nhập', 'error');
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      showModalAlert(null);
      pendingOtpEmail = document.getElementById('reg-email').value.trim();
      let shopUrl = document.getElementById('reg-shop-url').value.trim();
      if (shopUrl && !shopUrl.startsWith('http://') && !shopUrl.startsWith('https://')) {
        shopUrl = 'https://' + shopUrl;
      }
      const payload = {
        shop_name: document.getElementById('reg-shop-name').value.trim(),
        platform: document.getElementById('reg-platform').value,
        shop_url: shopUrl || 'https://shopee.vn',
        email: pendingOtpEmail,
        phone: document.getElementById('reg-phone').value.trim(),
        password: document.getElementById('reg-pwd').value
      };
      try {
        const res = await apiRequest('/api/v1/auth/register', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        showToast(res.message || 'Mã OTP đã gửi đến email', 'success');
        setAuthMode('otp');
        if (res.data?.dev_otp) {
          showModalAlert(`Mã OTP của bạn: 【 ${res.data.dev_otp} 】 (Đã tự động điền)`, 'info');
          setTimeout(() => {
            const otpInput = document.getElementById('otp-input');
            if (otpInput) otpInput.value = res.data.dev_otp;
          }, 150);
        }
      } catch (err) {
        showModalAlert(err.message || 'Lỗi đăng ký', 'error');
        showToast(err.message || 'Lỗi đăng ký', 'error');
      }
    }

    async function handleOtpSubmit(e) {
      e.preventDefault();
      showModalAlert(null);
      const otp = document.getElementById('otp-input').value;
      try {
        await apiRequest('/api/v1/auth/verify-email', {
          method: 'POST',
          body: JSON.stringify({ email: pendingOtpEmail, otp_code: otp })
        });
        showToast('Xác thực OTP thành công!', 'success');
        const pwd = document.getElementById('reg-pwd')?.value;
        if (pwd) {
          const res = await apiRequest('/api/v1/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email_or_phone: pendingOtpEmail, password: pwd })
          });
          localStorage.setItem('tapai_token', res.access_token);
          closeAuthModal();
          await checkAuth();
        } else {
          setAuthMode('login');
        }
      } catch (err) {
        showModalAlert(err.message || 'Mã OTP không đúng', 'error');
        showToast(err.message || 'Mã OTP không đúng', 'error');
      }
    }

    function handleLogout() {
      localStorage.removeItem('tapai_token');
      currentShop = null;
      const mobileNavBar = document.getElementById('mobile-nav-bar');
      if (mobileNavBar) mobileNavBar.classList.add('hidden');
      showToast('Đã đăng xuất', 'info');
      renderHeader();
      renderMain();
    }
  </script>
</body>
</html>
